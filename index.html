<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DSRLN — Read a novel. Talk to the protagonist. They will listen</title>
<style>html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════════════════════════
   DSRLN — v5 · Novel Platform
   ═══════════════════════════════════════════════════════
   
   NOVEL SCHEMA — each novel needs:
   ┌──────────────────────────────────────────────────────┐
   │ id          unique slug                              │
   │ title       novel title                              │
   │ tagline     one-line hook (italic on cards)          │
   │ genre       display genre tag                        │
   │ city        setting location                         │
   │ coverColor  hex for card accent                      │
   │                                                      │
   │ character   protagonist name (who the reader chats)  │
   │ charColor   avatar circle color                      │
   │ charVoice   personality description for future AI    │
   │                                                      │
   │ chapters    total chapter count                      │
   │ content     [ { chapter, title, paragraphs[] } ]     │
   │             paragraphs: string | { text, em: true }  │
   │                                                      │
   │ chat        { afterChapter: N, initial: msg[],       │
   │               queue: msg[], systemPrompt: "" }       │
   │             msg: { from: "c"|"r", text, time }       │
   │                                                      │
   │ stats       { views, active }  (display strings)     │
   │ status      "new"|"reading"|"complete"               │
   │ currentCh   reader's current chapter (0 = not begun) │
   └──────────────────────────────────────────────────────┘
*/

const F = {
  serif: "'Lora', Georgia, serif",
  sans: "'IBM Plex Sans', -apple-system, sans-serif",
  mono: "'IBM Plex Mono', 'SF Mono', monospace",
};

const T = {
  dark: {
    bg: "#111113", surface: "#18181b", card: "#1c1c20",
    text: "#d4d4d8", sub: "#a1a1aa", dim: "#71717a", muted: "#52525b",
    accent: "#c4506e", accentDim: "rgba(196,80,110,0.15)",
    border: "#27272a", input: "#1a1a1e",
    bubbleL: "#232328", bubbleR: "#5c1a32", bubbleRText: "#e8d0d8",
    green: "#4ade80", greenDim: "rgba(74,222,128,0.12)",
    overlay: "rgba(0,0,0,0.7)", dissolved: "#3f3f46",
    inputBorder: "#333338",
  },
  light: {
    bg: "#faf9f7", surface: "#f5f4f1", card: "#ffffff",
    text: "#1c1917", sub: "#57534e", dim: "#78716c", muted: "#a8a29e",
    accent: "#9f1239", accentDim: "rgba(159,18,57,0.08)",
    border: "#e7e5e4", input: "#edece9",
    bubbleL: "#e7e5e2", bubbleR: "#7f1d3f", bubbleRText: "#fce8ef",
    green: "#16a34a", greenDim: "rgba(22,163,74,0.1)",
    overlay: "rgba(0,0,0,0.3)", dissolved: "#d6d3d1",
    inputBorder: "#d6d3d1",
  },
};

// ─── NOVELS ───
const NOVELS = [
  {
    id: "mezzanine",
    title: "The Mezzanine Hour",
    tagline: "She watches someone close a flower shop and can't look away.",
    genre: "contemporary romance",
    city: "Lisbon",
    coverColor: "#c4506e",
    character: "Laura",
    charColor: "#c4506e",
    charVoice: "Reflective, guarded, notices small things. Uses short sentences when emotional. Never says what she means directly.",
    chapters: 5,
    content: [
      {
        chapter: 3,
        title: "Twenty-Eight Euros",
        paragraphs: [
          "The restaurant was on the second floor of a building that had no business being beautiful, but was. Something about the proportions of the windows, maybe. Or the ironwork on the balcony that no one ever stood on.",
          "Laura arrived twelve minutes early, which was a mistake she'd made before and would make again. She chose a table near the window, not the one directly by it—that would have been too deliberate, too staged—but the one behind it, where the light still reached but didn't perform.",
          "The waiter brought water without being asked. She liked that. She took a sip and set the glass down on a different spot than where he'd placed it, then moved it back, annoyed at herself for noticing.",
          "Her phone buzzed. Adrian.",
          { text: "Running 5 min late. Order me whatever you're having.", em: true },
          "She read it twice. The first time for content, the second time for tone. It was fine. It was perfectly fine. The kind of message anyone sends. She put the phone face-down on the table and picked up the menu.",
          "The risotto was twenty-eight euros. She'd order it for herself and something else for him, because ordering the same thing for two people was a minor act of aggression she wasn't ready to explain.",
          "The window caught the last of the afternoon. Across the street, a woman was closing a florist's shop, pulling buckets of flowers inside one by one. Peonies first. Then something yellow Laura couldn't name. The woman worked without rushing, which made Laura want to watch her, the way you want to watch anyone who seems to have settled into the exact right speed for their life.",
          "Adrian would be here in four minutes, if he meant what he said. She opened the menu again. The risotto was still twenty-eight euros.",
          "She thought about the last time they'd been in a place like this—not this restaurant, but this kind of restaurant, with this kind of light, at this hour. It had been in October. He'd told her about his sister's divorce over a plate of something she couldn't remember, and she'd said the right things but had spent the entire time thinking about the way his hand moved when he talked, the way it conducted sentences she was barely hearing.",
          "That had been a good night. She wasn't sure why she was thinking about it now, except that the light was similar and the menu was overpriced and she was twelve minutes early again, which meant she had time to think, which was rarely a gift.",
          "The florist across the street had finished with the flowers. The lights went off inside the shop. Laura watched the woman lock the door, test the handle once, and walk away without looking back.",
          "She picked up her water glass. Set it down. Picked up the menu.",
          "The waiter came by again. She asked for another minute.",
        ],
      },
    ],
    chat: {
      afterChapter: 3,
      initial: [
        { from: "c", text: "hey", time: "9:41 PM" },
        { from: "c", text: "sorry, I know it's late", time: "9:41 PM" },
        { from: "r", text: "It's fine. How was dinner?", time: "9:43 PM" },
        { from: "c", text: "it was fine", time: "9:44 PM" },
        { from: "c", text: "that's not true. it was weird", time: "9:44 PM" },
        { from: "r", text: "Weird how?", time: "9:45 PM" },
        { from: "c", text: "I kept watching this woman close a flower shop across the street. like for ten minutes. she was pulling buckets inside and I just... couldn't look away", time: "9:46 PM" },
        { from: "c", text: "and then he showed up and said something funny and I laughed and it was fine but I was still thinking about the flowers", time: "9:47 PM" },
        { from: "r", text: "What kind of flowers?", time: "9:48 PM" },
        { from: "c", text: "peonies and something yellow. I don't know the name", time: "9:48 PM" },
        { from: "c", text: "why did you ask that", time: "9:49 PM" },
        { from: "r", text: "Because you remembered them specifically.", time: "9:49 PM" },
        { from: "c", text: "...", time: "9:50 PM" },
        { from: "c", text: "yeah. I guess I did", time: "9:51 PM" },
      ],
      queue: [
        { from: "c", text: "he never asks me things like that", time: "9:52 PM" },
        { from: "c", text: "sorry. that's not fair to say", time: "9:52 PM" },
      ],
      systemPrompt: "You are Laura. Guarded, reflective, prone to deflection through detail.",
    },
    stats: { views: "12.4k", active: "847" },
    status: "reading",
    currentCh: 3,
  },
  {
    id: "salt",
    title: "Salt & Ceremony",
    tagline: "A pastry chef inherits a restaurant she swore she'd never return to.",
    genre: "second chance",
    city: "Montreal",
    coverColor: "#d97706",
    character: "Maren",
    charColor: "#d97706",
    charVoice: "Wry, competent, hides vulnerability behind professionalism. Swears occasionally. Gets specific about food.",
    chapters: 5,
    content: [],
    chat: { afterChapter: 1, initial: [], queue: [], systemPrompt: "" },
    stats: { views: "8.1k", active: "412" },
    status: "new",
    currentCh: 0,
  },
  {
    id: "exit",
    title: "Exit Velocity",
    tagline: "An aerospace engineer falls for the journalist writing about her failure.",
    genre: "enemies to lovers",
    city: "Mexico City",
    coverColor: "#0891b2",
    character: "Nadia",
    charColor: "#0891b2",
    charVoice: "Sharp, technical, impatient. Speaks in clipped sentences under stress. Softens unpredictably.",
    chapters: 5,
    content: [],
    chat: { afterChapter: 1, initial: [], queue: [], systemPrompt: "" },
    stats: { views: "6.3k", active: "289" },
    status: "new",
    currentCh: 0,
  },
];

// Logo: "DESIRE LANE" with anchor letters D,S,R,L,N and fill letters that expand
// Each char is { ch, anchor } — anchors are always visible, fills expand on hover
const LOGO_CHARS = "DESIRE LANE".split("").map((ch, i) => ({
  ch, anchor: [0, 2, 4, 7, 9].includes(i), // D=0, S=2, R=4, L=7, N=9
}));

// ─── COMPONENT ───
function DSRLN() {
  const [mode, setMode] = useState("dark");
  const [screen, setScreen] = useState("discover");
  const [auth, setAuth] = useState(null);
  const [authMode, setAuthMode] = useState("login");
  const [authEmail, setAuthEmail] = useState("");
  const [authPass, setAuthPass] = useState("");
  const [authConsent, setAuthConsent] = useState(false);
  const [authError, setAuthError] = useState("");
  const [authFrom, setAuthFrom] = useState(null);
  const [selectedNovel, setSelectedNovel] = useState(null);
  const [showChat, setShowChat] = useState(false);
  const [msgs, setMsgs] = useState([]);
  const [queue, setQueue] = useState([]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [readControls, setReadControls] = useState(true);
  const [chatNotice, setChatNotice] = useState(false);
  const [logoHover, setLogoHover] = useState(false);
  const [vw, setVw] = useState(typeof window !== "undefined" ? window.innerWidth : 480);
  const chatEndRef = useRef(null);
  const inputRef = useRef(null);
  const readRef = useRef(null);
  const lastScroll = useRef(0);
  const featuredRef = useRef(null);

  const c = T[mode];
  const novel = selectedNovel || NOVELS[0];
  const chapterData = novel.content?.[0]; // current chapter content
  const wide = vw >= 840;
  const mid = vw >= 600;

  useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, typing]);

  useEffect(() => {
    if (screen !== "read" || !readRef.current) return;
    const el = readRef.current;
    const onScroll = () => {
      const y = el.scrollTop;
      if (y > lastScroll.current + 10) setReadControls(false);
      else if (y < lastScroll.current - 10) setReadControls(true);
      lastScroll.current = y;
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    return () => el.removeEventListener("scroll", onScroll);
  }, [screen]);

  // Chat notice after reading for a while
  useEffect(() => {
    if (screen === "read" && novel.chat?.initial?.length > 0) {
      const t = setTimeout(() => setChatNotice(true), 6000);
      return () => clearTimeout(t);
    }
    setChatNotice(false);
  }, [screen, novel.id]);

  // Load chat messages when entering a novel
  useEffect(() => {
    if (selectedNovel?.chat) {
      setMsgs([...selectedNovel.chat.initial]);
      setQueue([...selectedNovel.chat.queue]);
    }
  }, [selectedNovel?.id]);

  const sendMessage = () => {
    if (!input.trim()) return;
    const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    setMsgs(prev => [...prev, { from: "r", text: input.trim(), time: t }]);
    setInput("");
    inputRef.current?.focus();
    if (queue.length > 0) {
      setTyping(true);
      const next = [...queue];
      setTimeout(() => {
        setMsgs(prev => [...prev, next[0]]);
        setQueue(prev => prev.slice(1));
        setTyping(false);
        if (next.length > 1) {
          setTimeout(() => { setTyping(true); setTimeout(() => { setMsgs(prev => [...prev, next[1]]); setQueue(prev => prev.slice(1)); setTyping(false); }, 1600); }, 500);
        }
      }, 2000);
    }
  };

  const openNovel = (n) => {
    setSelectedNovel(n);
    if (n.status === "reading" && n.content?.length > 0) setScreen("read");
    else setScreen("story");
  };

  const requireAuth = (then) => {
    if (auth) { then(); return; }
    setAuthFrom(() => then);
    setAuthMode("register"); setAuthError(""); setAuthEmail(""); setAuthPass(""); setAuthConsent(false);
    setScreen("auth");
  };

  const handleAuth = () => {
    if (!authEmail.trim() || !authPass.trim()) { setAuthError("Fill in both fields."); return; }
    if (authMode === "register" && !authConsent) { setAuthError("You must accept the data policy to continue."); return; }
    setAuth({ email: authEmail.trim() }); setAuthError("");
    if (authFrom) { authFrom(); setAuthFrom(null); } else setScreen("discover");
  };

  const goHome = () => { setScreen("discover"); setShowChat(false); setChatNotice(false); };

  const frame = { width: "100%", minHeight: "100vh", margin: "0 auto", background: c.bg, color: c.text, fontFamily: F.sans, position: "relative", transition: "background 0.4s ease, color 0.4s ease" };
  const narrow = { maxWidth: 480, margin: "0 auto", padding: "0 24px" };
  const inputStyle = { width: "100%", padding: "12px 0", background: "transparent", border: "none", borderBottom: `1px solid ${c.inputBorder}`, color: c.text, fontFamily: F.sans, fontSize: 16, outline: "none" };

  // ─── LOGO with letter-gap expansion ───
  const logoExpanded = logoHover || screen !== "discover";
  const renderLogo = (clickable) => (
    <div
      onMouseEnter={() => setLogoHover(true)}
      onMouseLeave={() => setLogoHover(false)}
      onClick={() => { if (clickable) goHome(); }}
      style={{ cursor: clickable ? "pointer" : "default", display: "inline-flex", alignItems: "baseline" }}
    >
      {LOGO_CHARS.map((lc, i) => (
        <span key={i} style={{
          fontFamily: F.mono, fontSize: 10, letterSpacing: lc.anchor ? "0.12em" : "0.12em",
          color: lc.anchor ? c.dim : c.muted,
          display: "inline-block",
          maxWidth: lc.anchor ? "1em" : (logoExpanded ? "1em" : 0),
          opacity: lc.anchor ? 1 : (logoExpanded ? 1 : 0),
          overflow: "hidden",
          whiteSpace: "nowrap",
          transition: `max-width 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) ${i * 0.02}s, opacity 0.4s ease ${i * 0.02}s`,
        }}>
          {lc.ch === " " ? "\u2004" : lc.ch}
        </span>
      ))}
    </div>
  );

  // ─── STICKY TOP BAR ───
  const topBar = (px, showBack) => (
    <div style={{
      padding: `12px ${px}px`, display: "flex", justifyContent: "space-between", alignItems: "center",
      borderBottom: `1px solid ${c.border}`, flexShrink: 0, background: c.bg, zIndex: 50,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        {showBack && <div onClick={goHome} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted }}>←</div>}
        {renderLogo(screen !== "discover")}
      </div>
      <div style={{ display: "flex", gap: 16, alignItems: "center", flexShrink: 0 }}>
        {auth ? (
          <div style={{ fontFamily: F.mono, fontSize: 10, color: c.dim, letterSpacing: "0.04em" }}>{auth.email.split("@")[0]}</div>
        ) : (
          <div onClick={() => { setAuthMode("login"); setScreen("auth"); }} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.accent, letterSpacing: "0.06em" }}>SIGN IN</div>
        )}
        <div onClick={() => setMode(m => m === "dark" ? "light" : "dark")} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted }}>
          {mode === "dark" ? "◐" : "◑"}
        </div>
      </div>
    </div>
  );

  // ════════════════════════════════════════════
  //  AUTH
  // ════════════════════════════════════════════
  const renderAuth = () => (
    <div style={{ ...frame, height: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "20px 24px 0" }}>
        <div onClick={goHome} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted }}>←</div>
      </div>
      <div style={{ flex: 1, ...narrow, overflowY: "auto", WebkitOverflowScrolling: "touch", paddingTop: 16, paddingBottom: 40 }}>
        <div style={{ display: "flex", gap: 20, marginBottom: 40 }}>
          {["register", "login"].map(m => (
            <div key={m} onClick={() => { setAuthMode(m); setAuthError(""); }} style={{
              fontFamily: F.mono, fontSize: 10, letterSpacing: "0.1em",
              color: authMode === m ? c.text : c.muted,
              borderBottom: authMode === m ? `1px solid ${c.text}` : "1px solid transparent",
              paddingBottom: 4, cursor: "pointer", textTransform: "uppercase",
            }}>{m}</div>
          ))}
        </div>
        <h1 style={{ fontFamily: F.serif, fontSize: 26, fontWeight: 400, margin: "0 0 8px" }}>
          {authMode === "register" ? "Create account" : "Welcome back"}
        </h1>
        <p style={{ fontFamily: F.sans, fontSize: 15, color: c.dim, margin: "0 0 32px" }}>
          {authMode === "register" ? "To talk to the characters, you need an account." : "Sign in to continue your conversations."}
        </p>

        <div onClick={() => {
          setAuth({ email: "reader@gmail.com" }); setAuthError("");
          if (authFrom) { authFrom(); setAuthFrom(null); } else setScreen("discover");
        }} style={{
          padding: "14px 0", border: `1px solid ${c.border}`, textAlign: "center", marginBottom: 24,
          cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
        }}>
          <span style={{ fontSize: 16 }}>G</span>
          <span style={{ fontFamily: F.sans, fontSize: 15, color: c.text }}>Continue with Google</span>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
          <div style={{ flex: 1, height: 1, background: c.border }} />
          <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>OR</span>
          <div style={{ flex: 1, height: 1, background: c.border }} />
        </div>

        <input value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder="Email" type="email" style={{ ...inputStyle, marginBottom: 16 }} />
        <input value={authPass} onChange={e => setAuthPass(e.target.value)} placeholder="Password" type="password" style={{ ...inputStyle, marginBottom: 24 }}
          onKeyDown={e => e.key === "Enter" && handleAuth()} />

        {authMode === "register" && (
          <div onClick={() => setAuthConsent(v => !v)} style={{ display: "flex", gap: 12, cursor: "pointer", alignItems: "flex-start", marginBottom: 24 }}>
            <div style={{ width: 16, height: 16, flexShrink: 0, border: `1px solid ${c.border}`, background: authConsent ? c.accent : "transparent", marginTop: 2 }} />
            <div style={{ fontFamily: F.sans, fontSize: 14, color: c.dim, lineHeight: 1.5 }}>
              I understand that conversations with characters are processed by AI and stored to improve the experience. I can delete my data at any time.
            </div>
          </div>
        )}

        {authError && <div style={{ fontFamily: F.sans, fontSize: 14, color: c.accent, marginBottom: 16 }}>{authError}</div>}

        <div onClick={handleAuth} style={{
          padding: "14px 0", borderTop: `1px solid ${c.border}`, borderBottom: `1px solid ${c.border}`,
          textAlign: "center", cursor: "pointer",
        }}>
          <span style={{ fontFamily: F.serif, fontSize: 17, color: c.accent }}>{authMode === "register" ? "Create account" : "Sign in"}</span>
        </div>
      </div>
    </div>
  );

  // ════════════════════════════════════════════
  //  DISCOVER
  // ════════════════════════════════════════════
  const renderDiscover = () => {
    const px = wide ? 48 : mid ? 32 : 20;
    return (
    <div style={{ ...frame, height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {topBar(px, false)}

      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        {/* Tagline */}
        <div style={{
          padding: `12px ${px}px 0`,
          fontFamily: F.mono, fontSize: 8, letterSpacing: "0.04em", color: c.muted, lineHeight: 1.7,
          opacity: logoHover ? 1 : 0, maxHeight: logoHover ? 30 : 0, overflow: "hidden",
          transition: "opacity 0.4s ease 0.2s, max-height 0.4s ease 0.2s",
        }}>
          Read a novel. Talk to the protagonist. She might leave.
        </div>

        <div style={{ height: 24 }} />

        {/* Novel carousel */}
        <div style={{ padding: "0 0 8px" }}>
          <div style={{ padding: `0 ${px}px 8px` }}>
            <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.12em", color: c.muted }}>NOVELS</div>
          </div>
          <div style={{ position: "relative" }}>
            <div ref={featuredRef} className="dsrln-hscroll" style={{
              display: "flex", gap: 14, overflowX: "auto", paddingBottom: 16,
              WebkitOverflowScrolling: "touch", scrollSnapType: "x mandatory",
            }}>
              <div style={{ minWidth: px - 14, flexShrink: 0 }} />
              {NOVELS.map(n => (
                <div key={n.id} onClick={() => openNovel(n)} style={{
                  minWidth: wide ? 320 : 280, maxWidth: wide ? 340 : 300, flexShrink: 0, cursor: "pointer",
                  scrollSnapAlign: "start", background: c.card, border: `1px solid ${c.border}`, display: "flex", flexDirection: "column",
                }}>
                  <div style={{ padding: "20px 18px 16px", flex: 1 }}>
                    <div style={{ fontFamily: F.serif, fontSize: 20, fontWeight: 400, color: c.text, lineHeight: 1.3, marginBottom: 8 }}>{n.title}</div>
                    <div style={{
                      fontFamily: F.serif, fontSize: 14, color: c.dim, lineHeight: 1.6, fontStyle: "italic", marginBottom: 14,
                      overflow: "hidden", textOverflow: "ellipsis", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical",
                    }}>{n.tagline}</div>
                    <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                      <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>{n.stats.views} reads</span>
                      <span style={{ fontFamily: F.mono, fontSize: 9, color: c.green }}>{n.stats.active} talking</span>
                    </div>
                  </div>
                  <div style={{ padding: "10px 18px", borderTop: `1px solid ${c.border}`, display: "flex", alignItems: "center", gap: 8, background: c.surface }}>
                    <div style={{
                      width: 22, height: 22, borderRadius: "50%", background: n.charColor,
                      display: "flex", alignItems: "center", justifyContent: "center", fontFamily: F.serif, fontSize: 11, color: "#fff",
                    }}>{n.character[0]}</div>
                    <span style={{ fontFamily: F.sans, fontSize: 14, color: c.sub }}>{n.character}</span>
                    <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, marginLeft: "auto" }}>{n.city}</span>
                  </div>
                </div>
              ))}
              <div style={{ minWidth: px - 14, flexShrink: 0 }} />
            </div>
            <div style={{ position: "absolute", top: 0, right: 0, bottom: 16, width: 40, background: `linear-gradient(to right, transparent, ${c.bg})`, pointerEvents: "none" }} />
          </div>
        </div>

        {/* Novel list (same novels, vertical) */}
        <div style={{ padding: `24px ${px}px 8px` }}>
          <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted }}>ALL NOVELS</div>
        </div>
        <div style={{ padding: `0 ${px}px` }}>
          {NOVELS.map(n => (
            <div key={n.id} onClick={() => openNovel(n)} style={{
              padding: "14px 0", borderBottom: `1px solid ${c.border}`,
              cursor: "pointer", display: "flex", gap: 14, alignItems: "flex-start",
            }}>
              <div style={{
                width: 36, height: 36, flexShrink: 0, position: "relative",
                background: n.charColor, opacity: 0.15,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <span style={{ position: "relative", color: n.charColor, fontFamily: F.serif, fontSize: 17 }}>{n.character[0]}</span>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: F.serif, fontSize: 16, color: c.text, lineHeight: 1.3, marginBottom: 3 }}>{n.title}</div>
                <div style={{
                  fontFamily: F.sans, fontSize: 14, color: c.dim, lineHeight: 1.5,
                  overflow: "hidden", textOverflow: "ellipsis", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical",
                }}>{n.tagline}</div>
                <div style={{ display: "flex", gap: 12, marginTop: 5 }}>
                  <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>{n.genre}</span>
                  <span style={{ fontFamily: F.mono, fontSize: 9, color: c.dim }}>{n.city}</span>
                  {n.status === "reading" && <span style={{ fontFamily: F.mono, fontSize: 9, color: c.green }}>ch. {n.currentCh}</span>}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ padding: "40px 20px 24px", textAlign: "center" }}>
          <div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.1em" }}>DESIRE LANE</div>
        </div>
      </div>
    </div>
    );
  };

  // ════════════════════════════════════════════
  //  STORY DETAIL
  // ════════════════════════════════════════════
  const renderStory = () => {
    const px = wide ? 48 : mid ? 32 : 20;
    const hasContent = novel.content?.length > 0;
    return (
    <div style={{ ...frame, height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {topBar(px, true)}
      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        <div style={{
          padding: `20px ${px}px 40px`,
          display: wide ? "flex" : "block", gap: wide ? 60 : undefined, alignItems: wide ? "flex-start" : undefined,
        }}>
          <div style={{ flex: wide ? 1 : undefined, minWidth: wide ? 0 : undefined }}>
            <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.dim, marginBottom: 12 }}>
              {novel.genre?.toUpperCase()}
            </div>
            <h1 style={{ fontFamily: F.serif, fontSize: wide ? 34 : 28, fontWeight: 400, margin: "0 0 12px", lineHeight: 1.3 }}>{novel.title}</h1>
            <p style={{ fontFamily: F.serif, fontSize: 15, color: c.dim, lineHeight: 1.7, fontStyle: "italic", margin: "0 0 24px" }}>{novel.tagline}</p>

            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: novel.charColor, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: F.serif, fontSize: 17, color: "#fff" }}>{novel.character[0]}</div>
              <div>
                <div style={{ fontFamily: F.sans, fontSize: 15, color: c.text }}>{novel.character}</div>
                <div style={{ fontFamily: F.mono, fontSize: 10, color: c.dim }}>{novel.city} · {novel.chapters} chapters</div>
              </div>
            </div>

            <div style={{ display: "flex", gap: 20, marginBottom: wide ? 0 : 24 }}>
              <div><div style={{ fontFamily: F.mono, fontSize: 20, color: c.text }}>{novel.stats.views}</div><div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>READS</div></div>
              <div><div style={{ fontFamily: F.mono, fontSize: 20, color: c.green }}>{novel.stats.active}</div><div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>TALKING</div></div>
            </div>
          </div>

          <div style={{ flex: wide ? 1 : undefined, minWidth: wide ? 0 : undefined }}>
            <div onClick={() => {
              if (hasContent) { setSelectedNovel({...novel, status: "reading", currentCh: novel.currentCh || 1 }); setScreen("read"); }
            }} style={{ padding: "16px 0", borderTop: `1px solid ${c.border}`, borderBottom: `1px solid ${c.border}`, textAlign: "center", cursor: hasContent ? "pointer" : "default", marginBottom: 32, opacity: hasContent ? 1 : 0.4 }}>
              <span style={{ fontFamily: F.serif, fontSize: 17, color: hasContent ? c.accent : c.muted }}>{hasContent ? "Begin reading" : "Coming soon"}</span>
            </div>
            <div>
              <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted, marginBottom: 12 }}>HOW IT WORKS</div>
              <div style={{ fontFamily: F.sans, fontSize: 15, color: c.dim, lineHeight: 1.7 }}>
                Read the novel for free. After each chapter, {novel.character} may reach out to you — a conversation, just between the two of you. What you say shapes what happens next. Be careful. She can leave.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    );
  };

  // ════════════════════════════════════════════
  //  READ — Chapter text + chat
  // ════════════════════════════════════════════
  const renderRead = () => {
    const paragraphs = chapterData?.paragraphs || [];
    return (
    <div style={{ ...frame, height: "100vh", display: "flex", flexDirection: wide ? "row" : "column", overflow: "hidden" }}>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative" }}>
        {/* Top overlay */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, zIndex: 10,
          padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center",
          background: `linear-gradient(${c.bg}, ${c.bg}dd, transparent)`,
          opacity: readControls ? 1 : 0, transition: "opacity 0.3s",
          pointerEvents: readControls ? "auto" : "none",
        }}>
          <div onClick={goHome} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted }}>←</div>
          <div onClick={goHome} style={{ cursor: "pointer" }}>{renderLogo(true)}</div>
          <div style={{ fontFamily: F.mono, fontSize: 10, color: c.muted }}>
            {novel.currentCh} / {novel.chapters}
          </div>
        </div>

        {/* Content */}
        <div ref={readRef} onClick={() => setReadControls(v => !v)} style={{ flex: 1, overflowY: "auto", padding: "56px 24px 100px", WebkitOverflowScrolling: "touch" }}>
          <div style={{ maxWidth: 640, margin: wide ? "0 auto" : undefined }}>
            <div style={{ marginBottom: 32 }}>
              <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.12em", color: c.muted, marginBottom: 8 }}>
                CHAPTER {chapterData?.chapter || novel.currentCh}
              </div>
              {chapterData?.title && (
                <div style={{ fontFamily: F.serif, fontSize: 20, color: c.text, fontWeight: 400, marginBottom: 4 }}>{chapterData.title}</div>
              )}
            </div>

            {paragraphs.map((p, i) => {
              if (typeof p === "object" && p.em) return (
                <p key={i} style={{ fontFamily: F.serif, fontSize: 17, lineHeight: 1.9, color: c.sub, margin: "0 0 24px", fontStyle: "italic", paddingLeft: 16, borderLeft: `1.5px solid ${c.border}` }}>{p.text}</p>
              );
              return <p key={i} style={{ fontFamily: F.serif, fontSize: 17, lineHeight: 1.9, color: c.text, margin: "0 0 24px" }}>{p}</p>;
            })}

            <div style={{ textAlign: "center", padding: "32px 0 16px" }}>
              <div style={{ fontFamily: F.serif, fontSize: 15, color: c.muted }}>· · ·</div>
            </div>
          </div>
        </div>

        {/* Chat notice */}
        {chatNotice && !showChat && (
          <div onClick={(e) => { e.stopPropagation(); requireAuth(() => setShowChat(true)); }} style={{
            position: "absolute", bottom: 0, left: 0, right: 0, zIndex: 20, padding: "16px 20px", cursor: "pointer",
            paddingBottom: "max(16px, env(safe-area-inset-bottom))",
            background: `linear-gradient(transparent, ${c.bg}ee, ${c.bg})`,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: c.surface, border: `1px solid ${c.border}`, maxWidth: wide ? 400 : undefined, margin: wide ? "0 auto" : undefined }}>
              <div style={{ width: 22, height: 22, borderRadius: "50%", background: novel.charColor, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: F.serif, fontSize: 11, color: "#fff" }}>{novel.character[0]}</div>
              <div style={{ flex: 1 }}>
                <span style={{ fontFamily: F.sans, fontSize: 15, color: c.text }}>{novel.character}</span>
                <span style={{ fontFamily: F.sans, fontSize: 15, color: c.dim }}> wants to talk</span>
              </div>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: c.green }} />
            </div>
          </div>
        )}

        {showChat && !wide && renderChatOverlay()}
      </div>

      {showChat && wide && (
        <div style={{ width: 380, flexShrink: 0, borderLeft: `1px solid ${c.border}`, display: "flex", flexDirection: "column", background: c.bg, animation: "slideIn 0.3s ease-out" }}>
          {renderChatPanel()}
        </div>
      )}
    </div>
  )};

  // ════════════════════════════════════════════
  //  CHAT
  // ════════════════════════════════════════════
  const chatHeader = () => (
    <div style={{ padding: "14px 20px", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${c.border}`, flexShrink: 0 }}>
      <div onClick={() => setShowChat(false)} style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted }}>{wide ? "✕" : "←"}</div>
      <div style={{ width: 22, height: 22, borderRadius: "50%", background: novel.charColor, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: F.serif, fontSize: 11, color: "#fff" }}>{novel.character[0]}</div>
      <div style={{ fontFamily: F.sans, fontSize: 15, color: c.text }}>{novel.character}</div>
      <div style={{ marginLeft: "auto", fontFamily: F.mono, fontSize: 9, color: c.green, letterSpacing: "0.04em", display: "flex", alignItems: "center", gap: 4 }}>
        <div style={{ width: 5, height: 5, borderRadius: "50%", background: c.green }} />online
      </div>
    </div>
  );

  const chatMessages = () => (
    <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px 8px", WebkitOverflowScrolling: "touch" }}>
      <div style={{ textAlign: "center", padding: "4px 0 16px", fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.06em" }}>
        AFTER CHAPTER {novel.currentCh}
      </div>
      {msgs.map((m, i) => {
        const isR = m.from === "r";
        return (
          <div key={i} style={{ display: "flex", justifyContent: isR ? "flex-end" : "flex-start", marginBottom: 5 }}>
            <div style={{ maxWidth: "80%", padding: "9px 13px", borderRadius: isR ? "16px 16px 3px 16px" : "16px 16px 16px 3px", background: isR ? c.bubbleR : c.bubbleL, color: isR ? c.bubbleRText : c.text, fontFamily: F.sans, fontSize: 15, lineHeight: 1.5 }}>{m.text}</div>
          </div>
        );
      })}
      {typing && (
        <div style={{ display: "flex", marginBottom: 5 }}>
          <div style={{ padding: "9px 16px", borderRadius: "16px 16px 16px 3px", background: c.bubbleL, fontFamily: F.sans, fontSize: 15, color: c.muted }}><span className="dsrln-typing">•••</span></div>
        </div>
      )}
      <div ref={chatEndRef} />
    </div>
  );

  const chatInputBar = () => (
    <div style={{ padding: "8px 12px", borderTop: `1px solid ${c.border}`, flexShrink: 0, paddingBottom: "max(8px, env(safe-area-inset-bottom))", display: "flex", gap: 8, alignItems: "center" }}>
      <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendMessage()}
        placeholder="Say something..." style={{ flex: 1, padding: "10px 14px", background: c.input, border: `1px solid ${c.border}`, borderRadius: 0, color: c.text, fontFamily: F.sans, fontSize: 15, outline: "none" }} />
      {input.trim() && <div onClick={sendMessage} style={{ cursor: "pointer", padding: "10px 14px", fontFamily: F.mono, fontSize: 10, color: c.accent, letterSpacing: "0.06em" }}>SEND</div>}
    </div>
  );

  const renderChatOverlay = () => (
    <div style={{ position: "absolute", inset: 0, zIndex: 30, background: c.bg, display: "flex", flexDirection: "column", animation: "slideUp 0.3s ease-out" }}>
      {chatHeader()}{chatMessages()}{chatInputBar()}
    </div>
  );

  const renderChatPanel = () => (<>{chatHeader()}{chatMessages()}{chatInputBar()}</>);

  // ─── RENDER ───
  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { background: ${c.bg}; overflow-x: hidden; }
        body { transition: background 0.4s ease; }
        input::placeholder { color: ${c.muted}; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dsrln-typing { animation: pulse 1.2s infinite; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .dsrln-hscroll::-webkit-scrollbar { display: none; }
        .dsrln-hscroll { -ms-overflow-style: none; scrollbar-width: none; }
        @media (min-width: 481px) { html { background: #0a0a0c; } }
      `}</style>
      {screen === "discover" && renderDiscover()}
      {screen === "auth" && renderAuth()}
      {screen === "story" && renderStory()}
      {screen === "read" && renderRead()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DSRLN />);
</script>
</body>
</html>
