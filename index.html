<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════════════════════════
   DSRLN — Mobile-First MVP v3
   ═══════════════════════════════════════════════════════
   Screens: discover → login/register → story → read → chat
   Sharp rectangles. No buttons. Text is the interface.
   Horizontal featured shelf. Data consent in register.
*/

const F = {
  serif: "'Lora', Georgia, serif",
  sans: "'IBM Plex Sans', -apple-system, sans-serif",
  mono: "'IBM Plex Mono', 'SF Mono', monospace",
};

const T = {
  dark: {
    bg: "#111113", surface: "#18181b", card: "#1c1c20",
    text: "#d4d4d8", sub: "#a1a1aa", dim: "#71717a", muted: "#52525b",
    accent: "#c4506e", accentDim: "rgba(196,80,110,0.15)", accentGlow: "rgba(196,80,110,0.06)",
    border: "#27272a", input: "#1a1a1e",
    bubbleL: "#232328", bubbleR: "#5c1a32", bubbleRText: "#e8d0d8",
    green: "#4ade80", greenDim: "rgba(74,222,128,0.12)",
    overlay: "rgba(0,0,0,0.7)", dissolved: "#3f3f46",
    inputBorder: "#333338",
  },
  light: {
    bg: "#faf9f7", surface: "#f5f4f1", card: "#ffffff",
    text: "#1c1917", sub: "#57534e", dim: "#78716c", muted: "#a8a29e",
    accent: "#9f1239", accentDim: "rgba(159,18,57,0.08)", accentGlow: "rgba(159,18,57,0.04)",
    border: "#e7e5e4", input: "#edece9",
    bubbleL: "#e7e5e2", bubbleR: "#7f1d3f", bubbleRText: "#fce8ef",
    green: "#16a34a", greenDim: "rgba(22,163,74,0.1)",
    overlay: "rgba(0,0,0,0.3)", dissolved: "#d6d3d1",
    inputBorder: "#d6d3d1",
  },
};

// ─── CATALOG DATA ───
const STORIES = [
  {
    id: "mezzanine", title: "The Mezzanine Hour", character: "Laura",
    tagline: "She watches someone close a flower shop and can't look away.",

    chapters: 5, city: "Montreal", status: "locked", currentChapter: 0, featured: true,
  },
  {

    tagline: "An aerospace engineer falls for the journalist writing about her failure.",
    genre: "enemies to lovers", views: "6.3k", active: "289",
    chapters: 5, city: "Mexico City", status: "locked", currentChapter: 0, featured: true,
  },
  {

    tagline: "She keeps meeting him at funerals. He keeps making her laugh.",

    chapters: 5, city: "Edinburgh", status: "locked", currentChapter: 0,
  },
  {
    id: "tides", title: "Small Tides", character: "June",

    chapters: 5, city: "Okinawa", status: "locked", currentChapter: 0,
  },
  {
    id: "glass", title: "Glass Hours", character: "Ren",
    tagline: "Time moves differently inside her studio. So does everything else.",
    genre: "literary romance", views: "2.9k", active: "71",
    chapters: 5, city: "Seoul", status: "locked", currentChapter: 0,
  },
];

const CHAPTER_TEXT = [
  "The restaurant was on the second floor of a building that had no business being beautiful, but was. Something about the proportions of the windows, maybe. Or the ironwork on the balcony that no one ever stood on.",
  "Laura arrived twelve minutes early, which was a mistake she'd made before and would make again. She chose a table near the window, not the one directly by it—that would have been too deliberate, too staged—but the one behind it, where the light still reached but didn't perform.",
  "The waiter brought water without being asked. She liked that. She took a sip and set the glass down on a different spot than where he'd placed it, then moved it back, annoyed at herself for noticing.",
  "Her phone buzzed. Adrian.",
  { text: "Running 5 min late. Order me whatever you're having.", em: true },
  "She read it twice. The first time for content, the second time for tone. It was fine. It was perfectly fine. The kind of message anyone sends. She put the phone face-down on the table and picked up the menu.",
  "The risotto was twenty-eight euros. She'd order it for herself and something else for him, because ordering the same thing for two people was a minor act of aggression she wasn't ready to explain.",
  "The window caught the last of the afternoon. Across the street, a woman was closing a florist's shop, pulling buckets of flowers inside one by one. Peonies first. Then something yellow Laura couldn't name. The woman worked without rushing, which made Laura want to watch her, the way you want to watch anyone who seems to have settled into the exact right speed for their life.",
  "Adrian would be here in four minutes, if he meant what he said. She opened the menu again. The risotto was still twenty-eight euros.",
  "She thought about the last time they'd been in a place like this—not this restaurant, but this kind of restaurant, with this kind of light, at this hour. It had been in October. He'd told her about his sister's divorce over a plate of something she couldn't remember, and she'd said the right things but had spent the entire time thinking about the way his hand moved when he talked, the way it conducted sentences she was barely hearing.",
  "That had been a good night. She wasn't sure why she was thinking about it now, except that the light was similar and the menu was overpriced and she was twelve minutes early again, which meant she had time to think, which was rarely a gift.",
  "The florist across the street had finished with the flowers. The lights went off inside the shop. Laura watched the woman lock the door, test the handle once, and walk away without looking back.",
  "She picked up her water glass. Set it down. Picked up the menu.",
  "The waiter came by again. She asked for another minute.",
];

const CHAT_MESSAGES = [
  { from: "c", text: "hey", time: "9:41 PM" },
  { from: "c", text: "sorry, I know it's late", time: "9:41 PM" },
  { from: "r", text: "It's fine. How was dinner?", time: "9:43 PM" },
  { from: "c", text: "it was fine", time: "9:44 PM" },
  { from: "c", text: "that's not true. it was weird", time: "9:44 PM" },
  { from: "r", text: "Weird how?", time: "9:45 PM" },
  { from: "c", text: "I kept watching this woman close a flower shop across the street. like for ten minutes. she was pulling buckets inside and I just... couldn't look away", time: "9:46 PM" },
  { from: "c", text: "and then he showed up and said something funny and I laughed and it was fine but I was still thinking about the flowers", time: "9:47 PM" },
  { from: "r", text: "What kind of flowers?", time: "9:48 PM" },
  { from: "c", text: "peonies and something yellow. I don't know the name", time: "9:48 PM" },
  { from: "c", text: "why did you ask that", time: "9:49 PM" },
  { from: "r", text: "Because you remembered them specifically.", time: "9:49 PM" },
  { from: "c", text: "...", time: "9:50 PM" },
  { from: "c", text: "yeah. I guess I did", time: "9:51 PM" },
];

const CHAT_QUEUE = [
  { from: "c", text: "he never asks me things like that", time: "9:52 PM" },
  { from: "c", text: "sorry. that's not fair to say", time: "9:52 PM" },
];

const IC = { L: "#c4506e", M: "#d97706", N: "#0891b2", C: "#7c3aed", J: "#059669", R: "#dc2626" };

// ─── COMPONENT ───
function DSRLN() {
  const [mode, setMode] = useState("dark");
  const [screen, setScreen] = useState("discover");
  const [auth, setAuth] = useState(null); // null | { email }
  const [authMode, setAuthMode] = useState("login"); // login | register
  const [authEmail, setAuthEmail] = useState("");
  const [authPass, setAuthPass] = useState("");
  const [authConsent, setAuthConsent] = useState(false);
  const [authError, setAuthError] = useState("");
  const [authFrom, setAuthFrom] = useState(null); // where to go after auth
  const [selectedStory, setSelectedStory] = useState(null);
  const [showChat, setShowChat] = useState(false);
  const [msgs, setMsgs] = useState([...CHAT_MESSAGES]);
  const [queue, setQueue] = useState([...CHAT_QUEUE]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [readControls, setReadControls] = useState(true);
  const [chatNotice, setChatNotice] = useState(false);
  const [logoOpen, setLogoOpen] = useState(false);
  const [vw, setVw] = useState(typeof window !== "undefined" ? window.innerWidth : 480);
  const chatEndRef = useRef(null);
  const inputRef = useRef(null);
  const readRef = useRef(null);
  const lastScroll = useRef(0);
  const featuredRef = useRef(null);

  const c = T[mode];
  const story = selectedStory || STORIES[0];
  const wide = vw >= 840;
  const mid = vw >= 600;

  useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, typing]);

  useEffect(() => {
    if (screen !== "read" || !readRef.current) return;
    const el = readRef.current;
    const onScroll = () => {
      const y = el.scrollTop;
      if (y > lastScroll.current + 10) setReadControls(false);
      else if (y < lastScroll.current - 10) setReadControls(true);
      lastScroll.current = y;
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    return () => el.removeEventListener("scroll", onScroll);
  }, [screen]);

  useEffect(() => {
    if (screen === "read") {
      const t = setTimeout(() => setChatNotice(true), 6000);
      return () => clearTimeout(t);
    }
    setChatNotice(false);
  }, [screen]);

  const sendMessage = () => {
    if (!input.trim()) return;
    const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    setMsgs(prev => [...prev, { from: "r", text: input.trim(), time: t }]);
    setInput("");
    inputRef.current?.focus();
    if (queue.length > 0) {
      setTyping(true);
      const next = [...queue];
      setTimeout(() => {
        setMsgs(prev => [...prev, next[0]]);
        setQueue(prev => prev.slice(1));
        setTyping(false);
        if (next.length > 1) {
          setTimeout(() => {
            setTyping(true);
            setTimeout(() => {
              setMsgs(prev => [...prev, next[1]]);
              setQueue(prev => prev.slice(1));
              setTyping(false);
            }, 1600);
          }, 500);
        }
      }, 2000);
    }
  };

  const openStory = (s) => {
    setSelectedStory(s);
    if (s.status === "reading") setScreen("read");
    else setScreen("story");
  };

  // Require login for chat
  const requireAuth = (then) => {
    if (auth) { then(); return; }
    setAuthFrom(() => then);
    setAuthMode("register");
    setAuthError("");
    setAuthEmail("");
    setAuthPass("");
    setAuthConsent(false);
    setScreen("auth");
  };

  const handleAuth = () => {
    if (!authEmail.trim() || !authPass.trim()) {
      setAuthError("Fill in both fields.");
      return;
    }
    if (authMode === "register" && !authConsent) {
      setAuthError("You must accept the data policy to continue.");
      return;
    }
    setAuth({ email: authEmail.trim() });
    setAuthError("");
    if (authFrom) { authFrom(); setAuthFrom(null); }
    else setScreen("discover");
  };

  const frame = {
    width: "100%", minHeight: "100vh", margin: "0 auto",
    background: c.bg, color: c.text, fontFamily: F.sans, position: "relative",
    transition: "background 0.4s ease, color 0.4s ease",
  };

  // Constrained column for forms/reading
  const narrow = { maxWidth: 480, margin: "0 auto", padding: "0 24px" };

  const inputStyle = {
    width: "100%", padding: "12px 0", background: "transparent",
    border: "none", borderBottom: `1px solid ${c.inputBorder}`,
    color: c.text, fontFamily: F.sans, fontSize: 15, outline: "none",
    transition: "border-color 0.2s",
  };

  // ════════════════════════════════════════════
  //  AUTH — Login / Register
  // ════════════════════════════════════════════
  const renderAuth = () => (
    <div style={{ ...frame, minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ ...narrow }}>
        {/* Back */}
        <div
          onClick={() => setScreen("discover")}
          style={{ padding: "20px 0", cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}
        >
          ←
        </div>
      </div>

      <div style={{ flex: 1, ...narrow, overflowY: "auto", WebkitOverflowScrolling: "touch", paddingTop: 16, paddingBottom: 40 }}>
        {/* Toggle login/register */}
        <div style={{ display: "flex", gap: 20, marginBottom: 40 }}>
          {["register", "login"].map(m => (
            <div
              key={m}
              onClick={() => { setAuthMode(m); setAuthError(""); }}
              style={{
                fontFamily: F.mono, fontSize: 10, letterSpacing: "0.1em",
                color: authMode === m ? c.text : c.muted,
                borderBottom: authMode === m ? `1px solid ${c.text}` : "1px solid transparent",
                paddingBottom: 4, cursor: "pointer", textTransform: "uppercase",
                transition: "color 0.2s, border-color 0.2s",
              }}
            >
              {m}
            </div>
          ))}
        </div>

        {/* Heading */}
        <h1 style={{
          fontFamily: F.serif, fontSize: 24, fontWeight: 400, margin: "0 0 8px", lineHeight: 1.3,
        }}>
          {authMode === "register" ? "Start reading" : "Welcome back"}
        </h1>
        <p style={{
          fontFamily: F.sans, fontSize: 13, color: c.dim, lineHeight: 1.6, margin: "0 0 32px",
        }}>
          {authMode === "register"
            ? "Reading is free. Talking to the characters costs $6.99 per novel."
            : "Sign in to your shelf."
          }
        </p>

        {/* Data consent — register only, shown FIRST */}
        {authMode === "register" && (
          <div style={{ marginBottom: 28 }}>
            <div
              onClick={() => setAuthConsent(v => !v)}
              style={{ display: "flex", gap: 12, cursor: "pointer", alignItems: "flex-start" }}
            >
              <div style={{
                width: 16, height: 16, flexShrink: 0, marginTop: 2,
                border: `1.5px solid ${authConsent ? c.accent : c.muted}`,
                background: authConsent ? c.accent : "transparent",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "all 0.15s",
              }}>
                {authConsent && (
                  <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5L4.5 7.5L8 3" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="square"/></svg>
                )}
              </div>
              <div style={{ fontFamily: F.sans, fontSize: 12, color: c.dim, lineHeight: 1.6 }}>
                I understand that my conversations with characters are used to improve the writing 
                and behavior of future characters. Everything I type — messages, reactions, choices — becomes 
                training material. My reading data, chat history, and interaction patterns are collected and 
                analyzed. I can delete my account and data at any time.
              </div>
            </div>
          </div>
        )}

        {/* Error */}
        {authError && (
          <div style={{ fontFamily: F.sans, fontSize: 12, color: c.accent, marginBottom: 16 }}>
            {authError}
          </div>
        )}

        {/* Google login */}
        <div
          onClick={() => {
            if (authMode === "register" && !authConsent) {
              setAuthError("Accept the data policy first.");
              return;
            }
            setAuth({ email: "user@gmail.com" });
            setAuthError("");
            if (authFrom) { authFrom(); setAuthFrom(null); }
            else setScreen("discover");
          }}
          style={{
            padding: "14px 0", borderTop: `1px solid ${c.border}`, borderBottom: `1px solid ${c.border}`,
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
            marginBottom: 24,
          }}
        >
          <svg width="16" height="16" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 019.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 000 24c0 3.77.9 7.35 2.56 10.52l7.97-5.93z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.93C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span style={{ fontFamily: F.sans, fontSize: 14, color: c.text }}>
            Continue with Google
          </span>
        </div>

        {/* Separator */}
        <div style={{
          display: "flex", alignItems: "center", gap: 12, marginBottom: 24,
        }}>
          <div style={{ flex: 1, height: 1, background: c.border }} />
          <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.06em" }}>OR</span>
          <div style={{ flex: 1, height: 1, background: c.border }} />
        </div>

        {/* Email field */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted, display: "block", marginBottom: 6 }}>
            EMAIL
          </label>
          <input
            type="email"
            value={authEmail}
            onChange={e => setAuthEmail(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleAuth()}
            placeholder="you@example.com"
            style={inputStyle}
            onFocus={e => e.target.style.borderBottomColor = c.accent}
            onBlur={e => e.target.style.borderBottomColor = c.inputBorder}
          />
        </div>

        <div style={{ marginBottom: 28 }}>
          <label style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted, display: "block", marginBottom: 6 }}>
            PASSWORD
          </label>
          <input
            type="password"
            value={authPass}
            onChange={e => setAuthPass(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleAuth()}
            placeholder="••••••••"
            style={inputStyle}
            onFocus={e => e.target.style.borderBottomColor = c.accent}
            onBlur={e => e.target.style.borderBottomColor = c.inputBorder}
          />
        </div>

        {/* Submit — a line you tap */}
        <div
          onClick={handleAuth}
          style={{
            padding: "16px 0", borderTop: `1px solid ${c.border}`, borderBottom: `1px solid ${c.border}`,
            cursor: "pointer", textAlign: "center",
          }}
        >
          <span style={{ fontFamily: F.serif, fontSize: 16, color: c.accent }}>
            {authMode === "register" ? "Create account" : "Sign in"}
          </span>
        </div>

        {/* Footer note */}
        {authMode === "register" && (
          <div style={{ marginTop: 24 }}>
            <div style={{
              fontFamily: F.mono, fontSize: 9, letterSpacing: "0.06em", color: c.muted, lineHeight: 1.7,
            }}>
              WHY WE COLLECT DATA — The characters in Desire Lane are written by AI and refined through 
              how readers interact with them. Your conversations teach future characters to be more 
              honest, more surprising, and more real. This is not passive analytics. Your words 
              directly shape the fiction.
            </div>
          </div>
        )}
      </div>
    </div>
  );

  // ════════════════════════════════════════════
  //  DISCOVER — Portal / landing
  // ════════════════════════════════════════════
  const featured = STORIES.filter(s => s.featured);
  const rest = STORIES.filter(s => !s.featured);

  const renderDiscover = () => {
    const px = wide ? 48 : mid ? 32 : 20;
    return (
    <div style={{ ...frame, minHeight: "100vh", overflowY: "auto", maxWidth: wide ? 1080 : undefined }}>
      {/* Top bar */}
      <div style={{ padding: `20px ${px}px 0`, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div
          className={`dsrln-logo${logoOpen ? " dsrln-logo-open" : ""}`}
          onClick={() => setLogoOpen(v => !v)}
          style={{ cursor: "pointer" }}
        >
          <div style={{
            fontFamily: F.mono, fontSize: 10, letterSpacing: "0.12em", color: c.dim,
            display: "flex", alignItems: "baseline", gap: 0,
          }}>
            <span className="dsrln-short">DSRLN</span>
            <span className="dsrln-full">DESIRE LANE</span>
          </div>
          <div className="dsrln-taglines" style={{
            fontFamily: F.mono, fontSize: 8, letterSpacing: "0.04em", color: c.muted,
            lineHeight: 1.7, marginTop: 3,
          }}>
            Read a novel. Talk to the protagonist. She might leave.
          </div>
        </div>
        <div style={{ display: "flex", gap: 16, alignItems: "center", flexShrink: 0 }}>
          {auth ? (
            <div style={{ fontFamily: F.mono, fontSize: 10, color: c.dim, letterSpacing: "0.04em" }}>
              {auth.email.split("@")[0]}
            </div>
          ) : (
            <div
              onClick={() => { setAuthMode("login"); setScreen("auth"); }}
              style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.accent, letterSpacing: "0.06em" }}
            >
              SIGN IN
            </div>
          )}
          <div
            onClick={() => setMode(m => m === "dark" ? "light" : "dark")}
            style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}
          >
            {mode === "dark" ? "◐" : "◑"}
          </div>
        </div>
      </div>

      {/* Spacer */}
      <div style={{ height: 32 }} />

      {/* Featured — horizontal scroll */}
      <div style={{ padding: "0 0 8px" }}>
        <div style={{ padding: `0 ${px}px 8px` }}>
          <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.12em", color: c.muted }}>FEATURED</div>
        </div>
        <div style={{ position: "relative" }}>
          <div
            ref={featuredRef}
            className="dsrln-hscroll"
            style={{
              display: "flex", gap: 14, overflowX: "auto", padding: `0 ${px}px 16px`,
              WebkitOverflowScrolling: "touch", scrollSnapType: "x mandatory",
              msOverflowStyle: "none", scrollbarWidth: "none",
            }}
          >
          {featured.map(s => (
            <div
              key={s.id}
              onClick={() => openStory(s)}
              style={{
                minWidth: wide ? 320 : 280, maxWidth: wide ? 340 : 300, flexShrink: 0, cursor: "pointer",
                scrollSnapAlign: "start",
                background: c.card, border: `1px solid ${c.border}`,
                display: "flex", flexDirection: "column",
              }}
            >
              <div style={{ padding: "20px 18px 16px", flex: 1 }}>
                <div style={{ fontFamily: F.serif, fontSize: 18, fontWeight: 400, color: c.text, lineHeight: 1.3, marginBottom: 8 }}>
                  {s.title}
                </div>
                <div style={{
                  fontFamily: F.serif, fontSize: 12, color: c.dim, lineHeight: 1.6, fontStyle: "italic",
                  marginBottom: 14,
                  overflow: "hidden", textOverflow: "ellipsis",
                  display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical",
                }}>
                  {s.tagline}
                </div>
                <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                  <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.04em" }}>
                    {s.views} reads
                  </span>
                  <span style={{ fontFamily: F.mono, fontSize: 9, color: c.green, letterSpacing: "0.04em" }}>
                    {s.active} talking
                  </span>
                </div>
              </div>
              {/* Character strip */}
              <div style={{
                padding: "10px 18px", borderTop: `1px solid ${c.border}`,
                display: "flex", alignItems: "center", gap: 8, background: c.surface,
              }}>
                <div style={{
                  width: 22, height: 22, borderRadius: "50%",
                  background: IC[s.character[0]] || c.accent,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontFamily: F.serif, fontSize: 11, color: "#fff",
                }}>
                  {s.character[0]}
                </div>
                <span style={{ fontFamily: F.sans, fontSize: 12, color: c.sub }}>{s.character}</span>
                <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, marginLeft: "auto" }}>{s.city}</span>
              </div>
            </div>
          ))}
          </div>
          {/* Right fade hint */}
          <div style={{
            position: "absolute", top: 0, right: 0, bottom: 16, width: 40,
            background: `linear-gradient(to right, transparent, ${c.bg})`,
            pointerEvents: "none",
          }} />
        </div>
      </div>

      {/* All stories */}
      <div style={{ padding: `12px ${px}px 8px` }}>
        <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted }}>ALL STORIES</div>
      </div>

      <div style={{
        padding: `0 ${px}px`,
        display: mid ? "grid" : "block",
        gridTemplateColumns: mid ? (wide ? "1fr 1fr 1fr" : "1fr 1fr") : undefined,
        gap: mid ? "0 20px" : undefined,
      }}>
      {rest.map(s => (
        <div
          key={s.id}
          onClick={() => openStory(s)}
          style={{
            padding: "14px 0",
            borderBottom: `1px solid ${c.border}`,
            cursor: "pointer", display: "flex", gap: 14, alignItems: "flex-start",
          }}
        >
          <div style={{
            width: 36, height: 36, flexShrink: 0,
            background: IC[s.character[0]] || c.accent, opacity: 0.15,
            display: "flex", alignItems: "center", justifyContent: "center",
            position: "relative",
          }}>
            <span style={{ position: "relative", color: IC[s.character[0]] || c.accent, fontFamily: F.serif, fontSize: 16 }}>
              {s.character[0]}
            </span>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: F.serif, fontSize: 15, color: c.text, lineHeight: 1.3, marginBottom: 3 }}>
              {s.title}
            </div>
            <div style={{
              fontFamily: F.sans, fontSize: 12, color: c.dim, lineHeight: 1.5,
              overflow: "hidden", textOverflow: "ellipsis",
              display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical",
            }}>
              {s.tagline}
            </div>
            <div style={{ display: "flex", gap: 12, marginTop: 5 }}>
              <span style={{ fontFamily: F.mono, fontSize: 9, color: c.muted }}>{s.views}</span>
              <span style={{ fontFamily: F.mono, fontSize: 9, color: c.dim }}>{s.genre}</span>
            </div>
          </div>
        </div>
      ))}
      </div>

      {/* Footer */}
      <div style={{ padding: "40px 20px 24px", textAlign: "center" }}>
        <div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.1em" }}>DESIRE LANE</div>
      </div>
    </div>
    );
  };

  // ════════════════════════════════════════════
  //  STORY — Detail for locked stories
  // ════════════════════════════════════════════
  const renderStory = () => {
    const px = wide ? 48 : mid ? 32 : 20;
    return (
    <div style={{ ...frame, minHeight: "100vh", overflowY: "auto", maxWidth: wide ? 1080 : undefined }}>
      <div
        onClick={() => setScreen("discover")}
        style={{ padding: `20px ${px}px`, cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}
      >
        ←
      </div>

      <div style={{
        padding: `0 ${px}px 40px`,
        display: wide ? "flex" : "block",
        gap: wide ? 60 : undefined,
        alignItems: wide ? "flex-start" : undefined,
      }}>
        {/* Left: identity */}
        <div style={{ flex: wide ? 1 : undefined, minWidth: wide ? 0 : undefined }}>
          <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.dim, marginBottom: 12 }}>
            {story.genre?.toUpperCase()}
          </div>
          <h1 style={{ fontFamily: F.serif, fontSize: wide ? 32 : 26, fontWeight: 400, margin: "0 0 12px", lineHeight: 1.3 }}>
            {story.title}
          </h1>
          <p style={{ fontFamily: F.serif, fontSize: 14, color: c.dim, lineHeight: 1.7, fontStyle: "italic", margin: "0 0 24px" }}>
            {story.tagline}
          </p>

          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
            <div style={{
              width: 36, height: 36, borderRadius: "50%",
              background: IC[story.character[0]] || c.accent,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: F.serif, fontSize: 16, color: "#fff",
            }}>
              {story.character[0]}
            </div>
            <div>
              <div style={{ fontFamily: F.sans, fontSize: 14, color: c.text }}>{story.character}</div>
              <div style={{ fontFamily: F.mono, fontSize: 10, color: c.dim }}>{story.city} · {story.chapters} chapters</div>
            </div>
          </div>

          <div style={{ display: "flex", gap: 20, marginBottom: wide ? 0 : 24 }}>
            <div>
              <div style={{ fontFamily: F.mono, fontSize: 18, color: c.text }}>{story.views}</div>
              <div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.06em" }}>READS</div>
            </div>
            <div>
              <div style={{ fontFamily: F.mono, fontSize: 18, color: c.green }}>{story.active}</div>
              <div style={{ fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.06em" }}>TALKING</div>
            </div>
          </div>
        </div>

        {/* Right: actions */}
        <div style={{ flex: wide ? 1 : undefined, minWidth: wide ? 0 : undefined }}>
          <div
            onClick={() => {
              setSelectedStory({...story, status: "reading", currentChapter: 1 });
              setScreen("read");
            }}
            style={{
              padding: "16px 0", borderTop: `1px solid ${c.border}`, borderBottom: `1px solid ${c.border}`,
              textAlign: "center", cursor: "pointer", marginBottom: 32,
            }}
          >
            <span style={{ fontFamily: F.serif, fontSize: 16, color: c.accent }}>Begin reading</span>
          </div>

          <div>
            <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.1em", color: c.muted, marginBottom: 12 }}>
              HOW IT WORKS
            </div>
            <div style={{ fontFamily: F.sans, fontSize: 13, color: c.dim, lineHeight: 1.7 }}>
              Read the novel for free. After each chapter, {story.character} may reach out to you — a conversation,
              just between the two of you. What you say shapes what happens next. Be careful. She can leave.
            </div>
          </div>
        </div>
      </div>
    </div>
    );
  };

  // ════════════════════════════════════════════
  //  READ — Full-screen
  // ════════════════════════════════════════════
  const renderRead = () => (
    <div style={{
      ...frame, height: "100vh", display: "flex", flexDirection: wide ? "row" : "column", overflow: "hidden",
    }}>
      {/* Reading pane */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative" }}>
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, zIndex: 10,
          padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center",
          background: `linear-gradient(${c.bg}, ${c.bg}dd, transparent)`,
          opacity: readControls ? 1 : 0, transition: "opacity 0.3s",
          pointerEvents: readControls ? "auto" : "none",
        }}>
          <div
            onClick={() => { setScreen("discover"); setShowChat(false); setChatNotice(false); }}
            style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}
          >
            ←
          </div>
          <div style={{ fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}>
            {story.currentChapter} / {story.chapters}
          </div>
          <div style={{ width: 16 }} />
        </div>

        <div
          ref={readRef}
          onClick={() => setReadControls(v => !v)}
          style={{ flex: 1, overflowY: "auto", padding: "56px 24px 100px", WebkitOverflowScrolling: "touch" }}
        >
          <div style={{ maxWidth: 640, margin: wide ? "0 auto" : undefined }}>
            <div style={{ marginBottom: 32 }}>
              <div style={{ fontFamily: F.mono, fontSize: 9, letterSpacing: "0.12em", color: c.muted, marginBottom: 8 }}>
                CHAPTER {story.currentChapter}
              </div>
            </div>

            {CHAPTER_TEXT.map((p, i) => {
              if (typeof p === "object" && p.em) {
                return (
                  <p key={i} style={{
                    fontFamily: F.serif, fontSize: 16, lineHeight: 1.9,
                    color: c.sub, margin: "0 0 24px", fontStyle: "italic",
                    paddingLeft: 16, borderLeft: `1.5px solid ${c.border}`,
                  }}>{p.text}</p>
                );
              }
              return (
                <p key={i} style={{
                  fontFamily: F.serif, fontSize: 16, lineHeight: 1.9,
                  color: c.text, margin: "0 0 24px",
                }}>{p}</p>
              );
            })}

            <div style={{ textAlign: "center", padding: "32px 0 16px" }}>
              <div style={{ fontFamily: F.serif, fontSize: 14, color: c.muted }}>· · ·</div>
            </div>
          </div>
        </div>

        {/* Chat notice — on mobile, bottom bar; on wide with chat open, hidden */}
        {chatNotice && !showChat && (
          <div
            onClick={(e) => {
              e.stopPropagation();
              requireAuth(() => setShowChat(true));
            }}
            style={{
              position: "absolute", bottom: 0, left: 0, right: 0, zIndex: 20,
              padding: "16px 20px", cursor: "pointer",
              paddingBottom: "max(16px, env(safe-area-inset-bottom))",
              background: `linear-gradient(transparent, ${c.bg}ee, ${c.bg})`,
            }}
          >
            <div style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "12px 16px", background: c.surface, border: `1px solid ${c.border}`,
              maxWidth: wide ? 400 : undefined, margin: wide ? "0 auto" : undefined,
            }}>
              <div style={{
                width: 22, height: 22, borderRadius: "50%",
                background: IC[story.character[0]] || c.accent,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontFamily: F.serif, fontSize: 11, color: "#fff",
              }}>
                {story.character[0]}
              </div>
              <div style={{ flex: 1 }}>
                <span style={{ fontFamily: F.sans, fontSize: 13, color: c.text }}>{story.character}</span>
                <span style={{ fontFamily: F.sans, fontSize: 13, color: c.dim }}> wants to talk</span>
              </div>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: c.green }} />
            </div>
          </div>
        )}

        {/* Mobile chat overlay */}
        {showChat && !wide && renderChatOverlay()}
      </div>

      {/* Desktop chat side panel */}
      {showChat && wide && (
        <div style={{
          width: 380, flexShrink: 0, borderLeft: `1px solid ${c.border}`,
          display: "flex", flexDirection: "column", background: c.bg,
          animation: "slideIn 0.3s ease-out",
        }}>
          {renderChatPanel()}
        </div>
      )}
    </div>
  );

  // ════════════════════════════════════════════
  //  CHAT — shared content
  // ════════════════════════════════════════════
  const chatHeader = () => (
    <div style={{
      padding: "14px 20px", display: "flex", alignItems: "center", gap: 10,
      borderBottom: `1px solid ${c.border}`, flexShrink: 0,
    }}>
      <div
        onClick={() => setShowChat(false)}
        style={{ cursor: "pointer", fontFamily: F.mono, fontSize: 10, color: c.muted, letterSpacing: "0.06em" }}
      >
        {wide ? "✕" : "←"}
      </div>
      <div style={{
        width: 22, height: 22, borderRadius: "50%",
        background: IC[story.character[0]] || c.accent,
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: F.serif, fontSize: 11, color: "#fff",
      }}>
        {story.character[0]}
      </div>
      <div style={{ fontFamily: F.sans, fontSize: 14, color: c.text }}>{story.character}</div>
      <div style={{
        marginLeft: "auto", fontFamily: F.mono, fontSize: 9,
        color: c.green, letterSpacing: "0.04em",
        display: "flex", alignItems: "center", gap: 4,
      }}>
        <div style={{ width: 5, height: 5, borderRadius: "50%", background: c.green }} />
        online
      </div>
    </div>
  );

  const chatMessages = () => (
    <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px 8px", WebkitOverflowScrolling: "touch" }}>
      <div style={{
        textAlign: "center", padding: "4px 0 16px",
        fontFamily: F.mono, fontSize: 9, color: c.muted, letterSpacing: "0.06em",
      }}>
        AFTER CHAPTER {story.currentChapter}
      </div>

      {msgs.map((m, i) => {
        const isR = m.from === "r";
        return (
          <div key={i} style={{ display: "flex", justifyContent: isR ? "flex-end" : "flex-start", marginBottom: 5 }}>
            <div style={{
              maxWidth: "80%", padding: "9px 13px",
              borderRadius: isR ? "16px 16px 3px 16px" : "16px 16px 16px 3px",
              background: isR ? c.bubbleR : c.bubbleL,
              color: isR ? c.bubbleRText : c.text,
              fontFamily: F.sans, fontSize: 14, lineHeight: 1.5,
            }}>
              {m.text}
            </div>
          </div>
        );
      })}

      {typing && (
        <div style={{ display: "flex", marginBottom: 5 }}>
          <div style={{
            padding: "9px 16px", borderRadius: "16px 16px 16px 3px",
            background: c.bubbleL, fontFamily: F.sans, fontSize: 14, color: c.muted,
          }}>
            <span className="dsrln-typing">•••</span>
          </div>
        </div>
      )}
      <div ref={chatEndRef} />
    </div>
  );

  const chatInput = () => (
    <div style={{
      padding: "8px 12px", borderTop: `1px solid ${c.border}`, flexShrink: 0,
      paddingBottom: "max(8px, env(safe-area-inset-bottom))",
      display: "flex", gap: 8, alignItems: "center",
    }}>
      <input
        ref={inputRef}
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => e.key === "Enter" && sendMessage()}
        placeholder="Say something..."
        style={{
          flex: 1, padding: "10px 14px",
          background: c.input, border: `1px solid ${c.border}`,
          borderRadius: 0, color: c.text, fontFamily: F.sans, fontSize: 14, outline: "none",
        }}
      />
      {input.trim() && (
        <div
          onClick={sendMessage}
          style={{
            cursor: "pointer", padding: "10px 14px",
            fontFamily: F.mono, fontSize: 10, color: c.accent, letterSpacing: "0.06em",
          }}
        >
          SEND
        </div>
      )}
    </div>
  );

  // Mobile: full-screen overlay
  const renderChatOverlay = () => (
    <div style={{
      position: "absolute", inset: 0, zIndex: 30,
      background: c.bg, display: "flex", flexDirection: "column",
      animation: "slideUp 0.3s ease-out",
    }}>
      {chatHeader()}
      {chatMessages()}
      {chatInput()}
    </div>
  );

  // Desktop: side panel (no absolute, no animation)
  const renderChatPanel = () => (
    <>
      {chatHeader()}
      {chatMessages()}
      {chatInput()}
    </>
  );

  // ─── RENDER ───
  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { background: ${c.bg}; overflow-x: hidden; }
        body { transition: background 0.4s ease; }
        input::placeholder { color: ${c.muted}; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        .dsrln-typing { animation: pulse 1.2s infinite; }
        .dsrln-full { display: none; }
        .dsrln-taglines { opacity: 0; max-height: 0; overflow: hidden; transition: opacity 0.3s, max-height 0.3s; }
        .dsrln-logo:hover .dsrln-short,
        .dsrln-logo-open .dsrln-short { display: none; }
        .dsrln-logo:hover .dsrln-full,
        .dsrln-logo-open .dsrln-full { display: inline; }
        .dsrln-logo:hover .dsrln-taglines,
        .dsrln-logo-open .dsrln-taglines { opacity: 1; max-height: 40px; }
        .dsrln-typing { animation: pulse 1.2s infinite; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .dsrln-hscroll::-webkit-scrollbar { display: none; }
        .dsrln-hscroll { -ms-overflow-style: none; scrollbar-width: none; }
        @media (min-width: 481px) { html { background: #0a0a0c; } }
      `}</style>
      {screen === "discover" && renderDiscover()}
      {screen === "auth" && renderAuth()}
      {screen === "story" && renderStory()}
      {screen === "read" && renderRead()}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(DSRLN));
</script>
</body>
</html>
