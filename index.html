// ─── ESSAY CONTENT PARSER ───
function parseEssayHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");
  // Try to find the main article content
  // kwalia.ai essays have content between the tags line and "Written by"
  const body = doc.body?.textContent ? doc.body : doc.documentElement;
  const allText = body?.innerHTML || html;
  
  // Extract content after tags and before "Written by" footer
  // Strategy: get all text nodes from the rendered page
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = allText;
  
  // Remove script, style, nav, header, footer elements
  tempDiv.querySelectorAll("script,style,nav,header,link,meta,noscript").forEach(el => el.remove());
  
  // Get the main content - look for article or main tag, or use body
  const article = tempDiv.querySelector("article, main, .essay-content, .content") || tempDiv;
  
  const blocks = [];
  const children = article.querySelectorAll("h1, h2, h3, p, blockquote, ul, ol");
  let started = false;
  
  for (const el of children) {
    const text = el.textContent.trim();
    if (!text) continue;
    // Skip navigation, header items
    if (text === "Essays" || text === "Subscribe" || text === "EN" || text === "ES") continue;
    if (text.includes("All Essays")) continue;
    if (text.includes("Written by")) break;
    if (text.includes("© 20")) break;
    
    // Start capturing from the first heading or the description line
    if (el.tagName === "H1") { started = true; continue; } // skip title (we show it separately)
    if (!started && (el.tagName === "H2" || el.tagName === "H3")) started = true;
    if (!started) {
      // Check if this looks like a description/subtitle or tag list
      if (text.length < 80 && !text.includes(".")) continue;
      started = true;
    }
    
    if (el.tagName === "H2" || el.tagName === "H3") {
      blocks.push({ type: "heading", text });
    } else if (el.tagName === "BLOCKQUOTE") {
      blocks.push({ type: "quote", text });
    } else {
      blocks.push({ type: "paragraph", text });
    }
  }
  
  // Fallback: if we got nothing, try plain text split
  if (blocks.length === 0) {
    const plainText = (article.textContent || "").trim();
    const lines = plainText.split(/\n\n+/).filter(l => l.trim().length > 40);
    for (const line of lines.slice(0, 60)) {
      blocks.push({ type: "paragraph", text: line.trim() });
    }
  }
  
  return blocks;
}

function DSRLN() {
  const [mode, setMode] = useState("dark");
  const [screen, setScreen] = useState("discover");
  const [auth, setAuth] = useState(null); // null | { email }
  const [authMode, setAuthMode] = useState("login"); // login | register
  const [authEmail, setAuthEmail] = useState("");
  const [authPass, setAuthPass] = useState("");
  const [authConsent, setAuthConsent] = useState(false);
  const [authError, setAuthError] = useState("");
  const [authFrom, setAuthFrom] = useState(null); // where to go after auth
  const [selectedStory, setSelectedStory] = useState(null);
  const [essayContent, setEssayContent] = useState(null); // parsed blocks
  const [essayLoading, setEssayLoading] = useState(false);
  const [essayError, setEssayError] = useState(null);
  const [readControls, setReadControls] = useState(true);
  const [logoOpen, setLogoOpen] = useState(false);
  const [vw, setVw] = useState(typeof window !== "undefined" ? window.innerWidth : 480);
  const readRef = useRef(null);
  const lastScroll = useRef(0);
  const featuredRef = useRef(null);

  const c = T[mode];
  const story = selectedStory || ESSAYS[0];
  const wide = vw >= 840;
  const mid = vw >= 600;

  useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    if (screen !== "read" || !readRef.current) return;
    const el = readRef.current;
    const onScroll = () => {
      const y = el.scrollTop;
      if (y > lastScroll.current + 10) setReadControls(false);
      else if (y < lastScroll.current - 10) setReadControls(true);
      lastScroll.current = y;
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    return () => el.removeEventListener("scroll", onScroll);
  }, [screen]);

  // Fetch essay content when entering read screen
  useEffect(() => {
    if (screen !== "read" || !story?.file) return;
    setEssayLoading(true);
    setEssayError(null);
    setEssayContent(null);
    fetch(ESSAY_BASE + story.file)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(html => {
        const blocks = parseEssayHTML(html);
        if (blocks.length === 0) throw new Error("No content parsed");
        setEssayContent(blocks);
        setEssayLoading(false);
      })
      .catch(err => {
        setEssayError("Could not load essay. Deploy to a live domain to enable cross-origin fetching.");
        setEssayLoading(false);
      });
  }, [screen, story?.file]);

  const openStory = (s) => {
    setSelectedStory(s);
    setScreen("story");
  };

  const handleAuth = () => {
    if (!authEmail.trim() || !authPass.trim()) {
      setAuthError("Fill in both fields.");
      return;
    }
    if (authMode === "register" && !authConsent) {
      setAuthError("You must accept the data policy to continue.");
      return;
    }
    setAuth({ email: authEmail.trim() });
    setAuthError("");
    if (authFrom) { authFrom(); setAuthFrom(null); }
    else setScreen("discover");
  };

  const frame = {
    width: "100%", minHeight: "100vh", margin: "0 auto",

                fontFamily: F.serif, fontSize: 17, lineHeight: 1.9,
                color: c.text, margin: "0 0 24px",
              }}>{block.text}</p>
            );
          })}

          {essayContent && (
            <div style={{ textAlign: "center", padding: "32px 0 16px" }}>
              <div style={{ fontFamily: F.serif, fontSize: 15, color: c.muted }}>· · ·</div>
              <a
                href={ESSAY_BASE + story.file}
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  display: "inline-block", marginTop: 20,
                  fontFamily: F.mono, fontSize: 11, color: c.accent,
                  letterSpacing: "0.04em", textDecoration: "none",
                }}
                onClick={e => e.stopPropagation()}
              >
                Read on kwalia.ai →
              </a>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  // ─── RENDER ───
  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { background: ${c.bg}; overflow-x: hidden; }
        body { transition: background 0.4s ease; }
        input::placeholder { color: ${c.muted}; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .dsrln-full { display: none; }
        .dsrln-taglines { opacity: 0; max-height: 0; overflow: hidden; transition: opacity 0.3s, max-height 0.3s; }
        .dsrln-logo:hover .dsrln-short,
        .dsrln-logo-open .dsrln-short { display: none; }
        .dsrln-logo:hover .dsrln-full,
        .dsrln-logo-open .dsrln-full { display: inline; }
        .dsrln-logo:hover .dsrln-taglines,
        .dsrln-logo-open .dsrln-taglines { opacity: 1; max-height: 40px; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .dsrln-hscroll::-webkit-scrollbar { display: none; }
        .dsrln-hscroll { -ms-overflow-style: none; scrollbar-width: none; }
        @media (min-width: 481px) { html { background: #0a0a0c; } }
      `}</style>
      {screen === "discover" && renderDiscover()}
      {screen === "auth" && renderAuth()}
      {screen === "story" && renderStory()}
      {screen === "read" && renderRead()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DSRLN />);
</script>
</body>
</html>
